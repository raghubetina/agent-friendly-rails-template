databases:
  - name: app-db
    plan: free
    databaseName: app_production
    user: app

services:
  - type: web
    name: app
    runtime: docker
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
