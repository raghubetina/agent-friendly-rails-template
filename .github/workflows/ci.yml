name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://rails:password@localhost:5432/app_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: corepack yarn install

      - name: Build assets
        run: bin/rails assets:precompile

      - name: Set up database
        run: bin/rails db:test:prepare

      - name: Security Scan - Brakeman
        run: bundle exec brakeman --no-pager

      - name: Security Scan - Bundler Audit
        run: |
          if [ -x bin/bundler-audit ]; then
            bin/bundler-audit check --update
          else
            bundle exec bundle-audit check --update
          fi

      - name: Linting - StandardRB
        run: bundle exec standardrb

      - name: Linting - Gemfile ordering
        run: bundle exec rubocop --only Bundler/OrderedGems Gemfile

      - name: Linting - Herb
        run: bundle exec herb analyze .

      - name: Run Tests
        run: bundle exec rspec
